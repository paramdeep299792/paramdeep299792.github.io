name: deploy
on:
  push:
    branches:
      - main
with:
  cname: paramdeep299792.me
permissions:
  contents: write
jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs gh-deploy --force